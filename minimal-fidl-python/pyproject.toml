[project]
name = "franca-idl"
version = "0.2.0"
description = "Franca IDL tooling - Includes a Parser for the implemented subset of FIDL."
authors = [
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["franca", "franca-idl", "idl", "fidl", "parsing"]
license = "MIT"

[project.urls]
Repository = "https://github.com/TimMeiwald/minimal-fidl"

[build-system]
requires = ["maturin>=1.8.6,<2.0"]
build-backend = "maturin"

# Development tooling, installed by `uv sync`. Not a runtime dependency: the
# published wheel is the compiled extension and nothing else.
#
# NOTE: the pyo3 version and its abi3-py38 feature are declared in Cargo.toml,
# where they belong. A `[dependencies.pyo3]` table used to sit here — Cargo
# syntax in a pyproject.toml, which no tool ever read.
[dependency-groups]
dev = [
    "maturin>=1.8.6,<2.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
